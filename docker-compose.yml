# Full stack: FastAPI app + LiveKit worker + Postgres + Qdrant.
#   docker compose up -d --build          # everything (needs .env with keys)
#   docker compose up -d postgres qdrant  # databases only (local uv dev mode)
#
# The Postgres/Qdrant host ports only matter for dev mode and must match
# DATABASE_URL / QDRANT_URL in .env; inside the compose network the services
# talk over the container ports directly (see x-app-env).

# Shared by migrate/app/worker: secrets/tuning come from .env; the connection
# URLs are overridden to point at the compose services instead of host ports.
x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
    QDRANT_URL: http://qdrant:6333
    APP_BASE_URL: http://app:8000

services:
  # One-shot: applies the schema before app/worker start, and exactly once
  # even if app is ever scaled to several replicas.
  migrate:
    build: .
    image: interview-agent
    <<: *app-env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: interview-agent
    <<: *app-env
    command: uvicorn interview_agent.server.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: .
    image: interview-agent
    <<: *app-env
    command: python main.py start
    restart: unless-stopped
    # On SIGTERM the worker stops taking jobs and drains active interviews;
    # give it time to finish them instead of killing calls after 10s.
    stop_grace_period: 600s
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        # The worker calls the app (APP_BASE_URL) to auto-trigger evaluation.
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships no curl/wget; bash's /dev/tcp checks the port is open.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  qdrant_data:

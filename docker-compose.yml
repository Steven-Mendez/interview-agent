# Postgres + Qdrant for the interview system.
services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-postgres
    # Non-default host ports (5433/6335): the standard ones tend to collide
    # with other local stacks. Must match DATABASE_URL / QDRANT_URL in .env.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: interview-qdrant
    ports:
      - "6335:6333" # HTTP
      - "6336:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:

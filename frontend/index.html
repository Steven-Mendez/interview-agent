<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Interview</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Version pinned: an unpinned CDN URL can break the app on any upstream release. -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.20.0/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <main>
    <h1>AI Interview</h1>

    <!-- 1: Upload -->
    <section id="upload-view">
      <h2>1 · Set up your interview</h2>
      <form id="upload-form">
        <label>
          Resume (PDF)
          <input type="file" name="resume" accept="application/pdf" required />
        </label>
        <label>
          Interviewer persona <span class="muted">(optional)</span>
          <input type="text" name="persona"
            placeholder="e.g. a strict FAANG engineering manager who digs deep" />
        </label>
        <label>
          Job offer
          <textarea name="job_offer" rows="8" required
            placeholder="Paste the job offer text here..."></textarea>
        </label>
        <label>
          Custom instructions <span class="muted">(optional)</span>
          <textarea name="custom_instructions" rows="3"
            placeholder="e.g. I want to practice system design questions; max 5 questions"></textarea>
        </label>
        <button type="submit" id="upload-btn">Create interview</button>
        <p id="upload-status" class="muted"></p>
      </form>
    </section>

    <!-- 2: Session (interview + results share the milestone sidebar) -->
    <section id="session-view" hidden>
      <div class="session-layout">
        <aside id="milestone-sidebar">
          <h3>Milestones</h3>
          <ul id="milestone-list"></ul>
        </aside>
        <div class="session-main">
          <div id="interview-panel">
            <h2>2 · Interview</h2>
            <button id="start-btn">Start voice interview</button>
            <span id="agent-state" class="agent-state" hidden></span>
            <p id="interview-status" class="muted"></p>
            <div id="chat-log"></div>
            <div id="audio-container"></div>
          </div>
          <div id="results-panel" hidden>
            <h2>3 · Result</h2>
            <p id="results-status" class="muted">Evaluating the interview…</p>
            <p id="results-error" class="muted" hidden></p>
            <button id="retry-eval-btn" hidden>Retry evaluation</button>
            <div id="results-box" hidden>
              <p><span id="hired-badge"></span> <strong id="score"></strong></p>
              <h3>Strengths</h3>
              <ul id="strengths"></ul>
              <h3>Weaknesses</h3>
              <ul id="weaknesses"></ul>
              <h3>Rationale</h3>
              <p id="rationale"></p>
              <p class="muted" id="ended-by"></p>
            </div>
            <button id="reset-btn" class="secondary">New interview</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>

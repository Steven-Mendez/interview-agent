[project]
name = "interview-agent"
version = "0.1.0"
description = "AI voice interview agent: a planner designs the interview from a resume and job offer, a LiveKit + LangGraph agent conducts it by voice, and an evaluator scores the candidate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LiveKit realtime voice agent framework + plugins
    "livekit-agents==1.8.3",
    "livekit-plugins-silero>=1.6.6",
    "livekit-plugins-langchain>=1.6.6",
    # LangGraph orchestration + OpenAI chat model
    "langgraph>=1.2.7",
    "langchain-openai>=1.3.3",
    "openai>=2.44.0",
    "langsmith[livekit]>=0.14.1,<0.15",
    # Config
    "pydantic-settings>=2.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.1",
    "python-multipart>=0.0.32",
    "markitdown[pdf]>=0.1.6",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "pdfminer-six>=20260107",
    # Anonymous metrics over OTLP
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "pyjwt[crypto]>=2.13.0",
    # Error reports without interview content (2.x; 3.x is an OTel-based alpha)
    "sentry-sdk>=2.71,<3",
]

[project.scripts]
agent = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interview_agent"]
